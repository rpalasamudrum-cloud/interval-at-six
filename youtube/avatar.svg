<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- Channel avatar master. Export to PNG at 800x800 before uploading.
       YouTube crops avatars to a circle, so nothing important goes outside
       the 720px circle centred at 400,400. -->
  <defs>
    <radialGradient id="wash" cx="18%" cy="88%" r="96%">
      <stop offset="0%" stop-color="#ff2d6f"></stop>
      <stop offset="52%" stop-color="#7a0f3d"></stop>
      <stop offset="100%" stop-color="#0a0612"></stop>
    </radialGradient>
    <radialGradient id="wash2" cx="86%" cy="10%" r="72%">
      <stop offset="0%" stop-color="#5b1fb0" stop-opacity="0.95"></stop>
      <stop offset="100%" stop-color="#0a0612" stop-opacity="0"></stop>
    </radialGradient>
    <pattern id="halftone" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.1" fill="#fff6e9" opacity="0.2"></circle>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="#0a0612"></rect>
  <rect width="800" height="800" fill="url(#wash)"></rect>
  <rect width="800" height="800" fill="url(#wash2)"></rect>
  <rect width="800" height="800" fill="url(#halftone)"></rect>

  <text x="400" y="392" text-anchor="middle"
        font-family="'Bebas Neue', Impact, 'Haettenschweiler', sans-serif"
        font-size="300" fill="#fff6e9" letter-spacing="6">CG</text>

  <rect x="238" y="436" width="324" height="9" rx="4.5" fill="#ffc93c"></rect>

  <text x="400" y="516" text-anchor="middle"
        font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="42" fill="#fff6e9" letter-spacing="13"
        opacity="0.92">GYAAN</text>
</svg>
