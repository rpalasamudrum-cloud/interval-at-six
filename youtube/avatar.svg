<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- Channel avatar master. Export to PNG at 800x800 before uploading.
       YouTube crops avatars to a circle, so nothing important goes outside
       the 720px circle centred at 400,400. -->
  <defs>
    <pattern id="avatarDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.4" fill="#b3321a"></circle>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="#efe6d4"></rect>
  <rect width="800" height="800" fill="url(#avatarDots)" opacity="0.3"></rect>

  <circle cx="400" cy="400" r="330" fill="#f7f1e4" stroke="#17130f" stroke-width="22"></circle>

  <text x="400" y="372" text-anchor="middle"
        font-family="Anton, Impact, 'Haettenschweiler', 'Arial Narrow', sans-serif"
        font-size="230" fill="#17130f" letter-spacing="4">CG</text>

  <rect x="196" y="416" width="408" height="12" fill="#17130f"></rect>

  <text x="400" y="500" text-anchor="middle"
        font-family="'Archivo Narrow', 'Arial Narrow', Arial, sans-serif"
        font-weight="700" font-size="52" fill="#b3321a" letter-spacing="10">GYAAN</text>
</svg>
