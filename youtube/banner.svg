<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- Channel banner master. Export to PNG at 2560x1440.
       YouTube shows the full 2560x1440 only on television. On phones it shows
       the centred 1546x423 box marked below, so everything that has to be
       readable lives inside x 507-2053, y 508-931. -->
  <defs>
    <pattern id="bannerDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="3.8" fill="#b3321a"></circle>
    </pattern>
  </defs>

  <rect width="2560" height="1440" fill="#efe6d4"></rect>
  <rect width="2560" height="1440" fill="url(#bannerDots)" opacity="0.26"></rect>

  <!-- panel rules bleeding off the edges, so the wide crop still reads as a strip -->
  <g stroke="#17130f" stroke-width="10" fill="none" opacity="0.5">
    <rect x="-40" y="150" width="480" height="1140"></rect>
    <rect x="2120" y="150" width="480" height="1140"></rect>
  </g>

  <!-- safe area -->
  <rect x="507" y="508" width="1546" height="423" fill="#f7f1e4" stroke="#17130f" stroke-width="12"></rect>

  <text x="1280" y="740" text-anchor="middle"
        font-family="Anton, Impact, 'Haettenschweiler', 'Arial Narrow', sans-serif"
        font-size="168" letter-spacing="2">
    <tspan fill="#17130f">COMIC </tspan><tspan fill="#b3321a">GYAAN</tspan>
  </text>

  <rect x="640" y="782" width="1280" height="6" fill="#17130f"></rect>

  <text x="1280" y="858" text-anchor="middle"
        font-family="'Archivo Narrow', 'Arial Narrow', Arial, sans-serif"
        font-weight="700" font-size="44" fill="#17130f" letter-spacing="12">THE DAY IN HINDI CINEMA, DRAWN IN PANELS</text>

  <text x="1280" y="912" text-anchor="middle"
        font-family="'Archivo Narrow', 'Arial Narrow', Arial, sans-serif"
        font-weight="500" font-size="34" fill="#b3321a" letter-spacing="8">NEW EDITION EVERY DAY &#183; EVERY PANEL SOURCED</text>
</svg>
