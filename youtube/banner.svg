<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- Channel banner master. Export to PNG at 2560x1440.
       YouTube shows the full 2560x1440 only on television. On phones it shows
       the centred 1546x423 box, so everything that has to be readable lives
       inside x 507-2053, y 508-931. -->
  <defs>
    <radialGradient id="bwash1" cx="6%" cy="96%" r="78%">
      <stop offset="0%" stop-color="#7a0f3d"></stop>
      <stop offset="100%" stop-color="#0a0612" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="bwash2" cx="92%" cy="6%" r="70%">
      <stop offset="0%" stop-color="#3a1170"></stop>
      <stop offset="100%" stop-color="#0a0612" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="bglow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff2d6f" stop-opacity="0.34"></stop>
      <stop offset="100%" stop-color="#ff2d6f" stop-opacity="0"></stop>
    </radialGradient>
    <pattern id="bhalftone" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.4" fill="#fff6e9" opacity="0.16"></circle>
    </pattern>
  </defs>

  <rect width="2560" height="1440" fill="#0a0612"></rect>
  <rect width="2560" height="1440" fill="url(#bwash1)"></rect>
  <rect width="2560" height="1440" fill="url(#bwash2)"></rect>
  <rect width="2560" height="1440" fill="url(#bhalftone)"></rect>
  <ellipse cx="1280" cy="720" rx="900" ry="420" fill="url(#bglow)"></ellipse>

  <!-- progress rail, the deck's own signature, bled across the top of the crop -->
  <g fill="#fff6e9">
    <rect x="507" y="466" width="180" height="7" rx="3.5"></rect>
    <rect x="699" y="466" width="180" height="7" rx="3.5"></rect>
    <rect x="891" y="466" width="180" height="7" rx="3.5" opacity="0.3"></rect>
    <rect x="1083" y="466" width="180" height="7" rx="3.5" opacity="0.3"></rect>
    <rect x="1275" y="466" width="180" height="7" rx="3.5" opacity="0.3"></rect>
    <rect x="1467" y="466" width="180" height="7" rx="3.5" opacity="0.3"></rect>
    <rect x="1659" y="466" width="180" height="7" rx="3.5" opacity="0.3"></rect>
    <rect x="1851" y="466" width="202" height="7" rx="3.5" opacity="0.3"></rect>
  </g>

  <!-- INTERVAL sets the width, AT SIX under it carries the colour -->
  <text x="1280" y="700" text-anchor="middle"
        font-family="'Bebas Neue', Impact, 'Haettenschweiler', sans-serif"
        font-size="196" fill="#fff6e9" letter-spacing="4">INTERVAL</text>
  <text x="1280" y="812" text-anchor="middle"
        font-family="'Bebas Neue', Impact, 'Haettenschweiler', sans-serif"
        font-size="118" fill="#ff2d6f" letter-spacing="18">AT SIX</text>

  <text x="1280" y="876" text-anchor="middle"
        font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="40" fill="#fff6e9" opacity="0.9">
    Six things that actually happened in Hindi cinema. Every day at 6pm IST.
  </text>

  <g>
    <rect x="1006" y="906" width="548" height="58" rx="29" fill="none" stroke="#a3e635" stroke-width="3" opacity="0.72"></rect>
    <circle cx="1046" cy="935" r="9" fill="#a3e635"></circle>
    <text x="1074" y="949" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif"
          font-weight="600" font-size="31" fill="#fff6e9" letter-spacing="3">EVERY CARD SOURCED</text>
  </g>
</svg>
